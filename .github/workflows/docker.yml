name: build and push docker image

on: 
  push:
    branches:
      - main


jobs:
  docker:
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to docker hub
      uses: docker/login-action@v3
      with: 
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set Short SHA
      run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Build and Push
      uses: docker/build-push-action@v6
      with: 
        context: .
        push: true
        tags: |
          loohhostels/docker-express:latest
          loohhostels/docker-express:${{ env.SHORT_SHA }}
  

  deploy: 
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: ssh key to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            mkdir -p /home/amitkys/docker-express
            cd /home/amitkys/docker-express
            if [ ! -d ".git" ]; then
              git clone git@github.com:amitkyslooh/docker-express.git .
            else
              git pull
            fi
            docker compose pull
            docker compose up -d --remove-orphans
      